<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abethu LMS — Data Architecture Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d; --surface:#0a0f1a; --surface2:#101828; --surface3:#16213a;
  --border:#1a2540; --border2:#2a3a5e;
  --text:#dde7f8; --dim:#8598b8; --faint:#4a5a7c;
  --brand:#f5a623; --num:#f5c56b; --danger:#f0616d;
  --org:#9aa8bd; --people:#63a6ff; --course:#35d39a; --delivery:#ff9a45; --learning:#ff7a7a;
  --commercial:#e87cf7; --financial:#a995ff; --cert:#2bd4ee; --comms:#a8e04a;
  --governance:#fbc531; --reviews:#f77ab8; --cms:#33d6c2;
  --sql-kw:#ff9a45; --sql-tbl:#35d39a; --sql-val:#f5c56b; --type:#7fb6ff; --enum:#e87cf7;
  --shadow:0 8px 30px rgba(0,0,0,.55);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
body.light{
  --bg:#f5efe2; --surface:#fffaf0; --surface2:#f3ead8; --surface3:#eadfc8;
  --border:#e2d6bd; --border2:#cdbf9f;
  --text:#272114; --dim:#6b614d; --faint:#a39780;
  --brand:#b86a00; --num:#9a5a00; --danger:#c22a3a;
  --org:#566173; --people:#1b5fd0; --course:#0a7d53; --delivery:#b9540a; --learning:#c82e2e;
  --commercial:#9a1fb0; --financial:#6238cf; --cert:#087690; --comms:#48700a;
  --governance:#946000; --reviews:#b9226f; --cms:#0b776d;
  --sql-kw:#b9540a; --sql-tbl:#0a7d53; --sql-val:#9a5a00; --type:#1b5fd0; --enum:#9a1fb0;
  --shadow:0 8px 30px rgba(80,60,20,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono)}
.num{color:var(--num);font-family:var(--mono)}

.d-org{--c:var(--org)}.d-people{--c:var(--people)}.d-course{--c:var(--course)}.d-delivery{--c:var(--delivery)}
.d-learning{--c:var(--learning)}.d-commercial{--c:var(--commercial)}.d-financial{--c:var(--financial)}
.d-cert{--c:var(--cert)}.d-comms{--c:var(--comms)}.d-governance{--c:var(--governance)}.d-reviews{--c:var(--reviews)}.d-cms{--c:var(--cms)}

/* top bar */
#top{flex:none;display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
#brand{font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap}
#brand b{color:var(--brand);font-weight:700}
#stats{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#searchbox{position:relative;margin-left:auto;width:300px;flex:none}
#search{width:100%;padding:7px 34px 7px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);font-size:12.5px}
#search::placeholder{color:var(--faint)}
#search:focus{border-color:var(--brand)}
#searchbox kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--border2);border-radius:4px;padding:0 5px}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow);z-index:300;display:none;padding:4px}
#results.open{display:block}
.res{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-family:var(--mono);font-size:11.5px}
.res.cur,.res:hover{background:var(--surface3)}
.res .k{font-family:var(--sans);font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);width:46px;flex:none}
.res .t{color:var(--c)}
.res .s{color:var(--dim);margin-left:auto;font-size:10.5px;white-space:nowrap}
.res mark{background:none;color:var(--brand);font-weight:600}
.res-empty{padding:10px;color:var(--dim);font-size:12px}
.tools{display:flex;gap:4px;flex:none}
.tb{height:30px;min-width:30px;padding:0 9px;border-radius:7px;border:1px solid var(--border2);background:var(--surface2);font-size:12px;color:var(--dim)}
.tb:hover{color:var(--text);border-color:var(--dim)}
.tb.on{color:var(--brand);border-color:var(--brand)}

/* filter + scenario bar */
#bar{flex:none;display:flex;align-items:center;gap:6px;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto}
#bar .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin-right:2px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--border2);font-size:11.5px;color:var(--dim);white-space:nowrap;flex:none}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.chip .num{font-size:10px;color:var(--faint)}
.chip:hover{color:var(--text)}
.chip.on{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip.on .num{color:var(--c)}
#bar .sep{width:1px;height:20px;background:var(--border2);margin:0 8px;flex:none}
.scn-btn{height:26px;padding:0 11px;border-radius:7px;border:1px solid var(--border2);font-size:11.5px;color:var(--dim);white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
.scn-btn::before{content:'';width:0;height:0;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.scn-btn:hover{color:var(--text)}
.scn-btn.on{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}

/* main */
#main{flex:1;display:flex;min-height:0}
#wrap{flex:1;min-width:0;overflow:auto;position:relative}
#sizer{position:relative}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;pointer-events:none;z-index:30;overflow:visible}
.block{position:absolute;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 22%,transparent);background:color-mix(in srgb,var(--c) 4%,transparent)}
.block h2{position:absolute;left:14px;top:9px;font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--c);white-space:nowrap}
.block h2 span{color:var(--dim);font-weight:400;margin-left:6px}
.card{position:absolute;width:184px;height:64px;padding:8px 10px 8px 13px;text-align:left;border-radius:8px;border:1px solid var(--border);background:var(--surface);z-index:10;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .2s,border-color .15s,box-shadow .2s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:8px 0 0 8px;background:var(--c)}
.card .nm{font-family:var(--mono);font-size:11px;font-weight:600;line-height:1.25;color:var(--text)}
.card .meta{display:flex;gap:9px;font-size:10px;color:var(--dim);font-family:var(--mono)}
.card .meta b{font-weight:500;color:var(--num)}
.card:hover{border-color:var(--c);background:var(--surface2)}
.card.nb{border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.card.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 22px -4px var(--c);background:var(--surface2);z-index:20}
.card.off{opacity:.14}
#canvas.focus .card:not(.sel):not(.nb){opacity:.22}
#canvas.scn .card:not(.now):not(.past){opacity:.22}

.card .tag{position:absolute;top:-8px;right:8px;height:16px;padding:0 7px;line-height:14px;border-radius:8px;font-family:var(--sans);font-size:9.5px;font-weight:600;border:1px solid var(--c);color:var(--c);background:var(--surface)}
.card .tag:empty{display:none}

/* view bar */
[hidden]{display:none!important}
#viewbar{position:sticky;top:0;left:0;z-index:50;display:flex;align-items:center;gap:14px;min-height:46px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.segc{display:flex;flex:none;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.segc button{padding:5px 12px;font-size:12px;color:var(--dim)}
.segc button:hover{color:var(--text)}
.segc button.on{background:var(--surface3);color:var(--text)}
#vb-info{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;min-width:0;font-size:11.5px;color:var(--dim)}
#vb-info b{font-family:var(--mono);font-weight:600;color:var(--text)}
.lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lg svg{color:var(--text)}
body:not([data-view=map]) #zoom-in,body:not([data-view=map]) #zoom-out,body:not([data-view=map]) #zoom-fit{display:none}
#reopen{margin-left:auto;flex:none}

/* ER diagrams (relationships view and scenario lanes) */
.er{position:relative;display:flex;align-items:flex-start;gap:120px;width:max-content;min-width:100%;padding:20px 24px 48px}
.er svg.links{position:absolute;left:0;top:0;z-index:3;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;gap:10px}
.col-h{height:22px;line-height:22px;overflow:hidden;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--dim);white-space:nowrap}
.pin{position:sticky;top:66px;z-index:2;display:flex;align-items:flex-start;align-self:flex-start;gap:120px}
.col.mid .ec{width:290px;box-shadow:0 0 0 1px var(--c),0 0 26px -6px var(--c)}
.ec{display:block;width:240px;padding:0;text-align:left;border:1px solid color-mix(in srgb,var(--c) 45%,var(--border));border-radius:8px;background:var(--surface);overflow:hidden;transition:opacity .15s,border-color .15s}
.ec:hover{border-color:var(--c)}
.ec.ghost{border-style:dashed}
.ec-h{display:flex;align-items:center;gap:8px;padding:7px 10px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.ec-n{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--c);overflow-wrap:anywhere}
.ec-h .b,.ec-h .op{margin-left:auto;flex:none}
.er-r{display:flex;align-items:center;gap:8px;height:26px;padding:0 10px 0 13px;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;white-space:nowrap}
.er-r .rn{color:var(--text)}
.er-r.pk .rn{color:var(--brand)}
.er-r .rty{margin-left:auto;font-size:10px;color:var(--type)}
.er-r .b{margin-left:auto;flex:none}
.er-r .rv{margin-left:auto;padding:0 7px;border-radius:4px;font-weight:600;color:var(--bg);background:var(--sc)}
.er-r.lk-row .rn{font-family:var(--sans);color:var(--dim)}
.ec-f{padding:6px 10px 6px 13px;border-top:1px solid var(--border);font-size:10.5px;color:var(--dim)}
.empty{width:240px;padding:14px;border:1px dashed var(--border2);border-radius:8px;font-size:12px;line-height:1.5;color:var(--dim)}
.lk{fill:none;stroke-width:1.5;stroke-linecap:round;transition:opacity .15s}
.lk.opt .m{stroke-dasharray:5 4}
.lk.lookup .m{stroke-dasharray:2 5}
.er.hov .lk{opacity:.1}
.er.hov .lk.hl{opacity:1;stroke-width:2.4}
.er.hov .lk.trunk{opacity:.45}
.lk .dot{stroke:none}
.er.hov .ec{opacity:.4}
.er.hov .ec.hl{opacity:1}

/* scenario lanes */
#scnview{padding:4px 16px 48px;--sc:var(--brand)}
.lane{width:max-content;min-width:100%;margin-top:12px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--surface) 55%,transparent);opacity:.45;cursor:pointer;transition:opacity .2s,border-color .2s}
.lane:hover{opacity:.8}
.lane.cur{opacity:1;border-color:var(--sc)}
.lane header{display:flex;align-items:center;gap:8px;padding:11px 14px 0}
.lane .sn{flex:none;width:20px;height:20px;border-radius:10px;border:1px solid var(--sc);color:var(--sc);font-family:var(--mono);font-size:10.5px;font-weight:600;line-height:18px;text-align:center}
.lane.cur .sn{background:var(--sc);color:var(--bg)}
.lane .st{font-size:12.5px;font-weight:600}
.lane header .op{margin-left:0}
.lane .er{align-items:center;min-width:0;padding:14px 24px 18px}

/* domain matrix */
.mx{display:grid;grid-template-columns:86px repeat(12,1fr);gap:2px;font-size:10.5px}
.mx .ch{height:74px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.mx .ch span{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--c);white-space:nowrap}
.mx .rh{display:flex;align-items:center;color:var(--c);white-space:nowrap;overflow:hidden}
.mx .cell{height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-family:var(--mono);font-size:10.5px;color:var(--text);background:color-mix(in srgb,var(--c) calc(var(--k) * 1%),var(--surface))}
.mx .cell.z{color:transparent;background:var(--surface)}
.mx .cell.dg{outline:1px solid var(--border2);outline-offset:-1px}
.mx-cap{margin-top:8px;font-size:11px;line-height:1.5;color:var(--dim)}

/* side panel */
#panel{flex:none;width:420px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
#panel.closed{display:none}
#tabs{flex:none;display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--border)}
.tab{padding:7px 12px;font-size:12px;color:var(--dim);border-radius:7px 7px 0 0;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tab:disabled{opacity:.35;cursor:default}
.tab.on{color:var(--text);background:var(--bg);border-color:var(--border)}
#tabs .x{margin-left:auto;color:var(--dim);font-size:15px;padding:4px 8px}
#tabs .x:hover{color:var(--text)}
#pbody{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 28px;background:var(--bg)}
#reopen{display:none}
#reopen.show{display:block}
.ph{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--c);overflow-wrap:anywhere}
.psub{font-size:11.5px;color:var(--dim);margin-top:3px}
.psub .tag{display:inline-block;padding:0 6px;border-radius:4px;border:1px solid var(--border2);font-family:var(--mono);font-size:10px;margin-right:6px}
.note{margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--text);padding:10px 12px;border-radius:8px;background:var(--surface);border-left:3px solid var(--c)}
h3{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h3 .num{font-size:10.5px}
h3 input{margin-left:auto;width:130px;padding:3px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);font-size:11px;text-transform:none;letter-spacing:0;font-weight:400}
.f{padding:6px 8px;border-radius:6px;border:1px solid transparent}
.f + .f{border-top-color:var(--border)}
.f.flash{background:color-mix(in srgb,var(--brand) 16%,transparent);border-color:var(--brand)}
.f .l1{display:flex;align-items:baseline;gap:8px;font-family:var(--mono)}
.f .fn{font-size:12px;font-weight:500;color:var(--text);overflow-wrap:anywhere}
.f.pk .fn{color:var(--brand)}
.f.fk .fn{color:var(--c)}
.f .ft{margin-left:auto;font-size:11px;color:var(--type);text-align:right;overflow-wrap:anywhere}
.f .ft.en{color:var(--enum)}
.f .l2{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.b{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:4px;font-family:var(--mono);font-size:9.5px;border:1px solid var(--border2);color:var(--dim);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.b.pk{color:var(--brand);border-color:var(--brand)}
.b.uq{color:var(--cert);border-color:var(--cert)}
.b.nn{color:var(--text)}
.b.nul{color:var(--faint);border-style:dashed}
.b.def{color:var(--num)}
.b.del{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
button.b.to{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
button.b.to:hover{background:color-mix(in srgb,var(--c) 24%,transparent)}
.en-row{margin-bottom:10px}
.en-name{font-family:var(--mono);font-size:11.5px;color:var(--enum)}
.en-use{font-size:10.5px;color:var(--dim);margin-left:6px}
.ev{display:inline-block;margin:4px 4px 0 0;padding:1px 7px;border-radius:4px;background:var(--surface);border:1px solid var(--border2);font-family:var(--mono);font-size:10.5px;color:var(--text)}
.ev.cur{background:var(--sc);border-color:var(--sc);color:var(--bg);font-weight:600}
.ix{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:4px 0;font-family:var(--mono);font-size:11px;overflow-wrap:anywhere}
.rel{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:6px;font-family:var(--mono);font-size:11.5px}
.rel:hover{background:var(--surface2)}
.rel i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
.rel .rt{color:var(--c)}
.rel .rc{color:var(--dim);margin-left:auto;font-size:10.5px;text-align:right;overflow-wrap:anywhere}
.hint{font-size:12px;color:var(--dim);line-height:1.6}
.hint kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border2);border-radius:4px;padding:0 5px;color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{padding:10px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);text-align:center}
.tile b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;color:var(--num)}
.tile span{font-size:10.5px;color:var(--dim)}
.bar{display:grid;grid-template-columns:170px 1fr 30px;align-items:center;gap:8px;width:100%;padding:4px 6px;border-radius:6px;font-family:var(--mono);font-size:11.5px;text-align:left}
.bar:hover{background:var(--surface2)}
.bar .bn{color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:8px;border-radius:4px;background:var(--surface2)}
.bar .bt i{display:block;height:100%;border-radius:4px;background:var(--c)}
.bar .num{text-align:right;font-size:11px}

/* scenario panel */
#ctl{position:sticky;top:-14px;z-index:5;background:var(--bg);margin:-14px -16px 0;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.ctl-row{display:flex;align-items:center;gap:6px}
.ctl-title{font-size:14px;font-weight:600;color:var(--sc);margin-bottom:10px}
.cb{height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);font-size:12px;color:var(--text)}
.cb:hover:not(:disabled){border-color:var(--sc)}
.cb:disabled{opacity:.35;cursor:default}
.cb.play{border-color:var(--sc);color:var(--sc);min-width:74px}
.ctl-count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}
.ctl-count b{color:var(--num);font-weight:600}
.seg{display:flex;gap:4px;margin-top:10px}
.seg button{flex:1;height:6px;border-radius:3px;background:var(--surface3)}
.seg button.done{background:color-mix(in srgb,var(--sc) 45%,transparent)}
.seg button.cur{background:var(--sc)}
#state{margin-top:10px;min-height:54px;font-size:11.5px;color:var(--dim)}
#state .sl{font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#state .sl b{color:var(--sc);font-weight:500}
.step{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);opacity:.55;cursor:pointer;transition:opacity .2s,border-color .2s}
.step:hover{opacity:.85}
.step.cur{opacity:1;border-color:var(--sc)}
.step .sh{display:flex;align-items:center;gap:8px}
.step .sn{flex:none;width:20px;height:20px;border-radius:10px;border:1px solid var(--sc);color:var(--sc);font-family:var(--mono);font-size:10.5px;font-weight:600;line-height:18px;text-align:center}
.step.cur .sn{background:var(--sc);color:var(--bg)}
.step .st{font-size:12.5px;font-weight:600}
.op{margin-left:auto;flex:none;font-family:var(--mono);font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.op.READ{color:var(--people)}.op.INSERT{color:var(--course)}.op.UPDATE{color:var(--delivery)}
.step .tabs2{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tc{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);color:var(--c)}
.tc.w{background:color-mix(in srgb,var(--c) 16%,transparent)}
.sql{margin-top:8px;padding:9px 10px;border-radius:7px;background:var(--bg);border:1px solid var(--border);font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.sql .kw{color:var(--sql-kw);font-weight:500}.sql .tbl{color:var(--sql-tbl)}.sql .val{color:var(--sql-val)}
.sn-note{margin-top:7px;padding:6px 9px;font-size:11.5px;line-height:1.5;color:var(--text);border-left:2px solid var(--sc);background:color-mix(in srgb,var(--sc) 7%,transparent);border-radius:0 6px 6px 0}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:10.5px;color:var(--dim)}
.legend svg{vertical-align:middle;margin-right:4px}

@media (max-width:900px){
  #main{flex-direction:column}
  #panel{width:auto;height:46%;border-left:0;border-top:1px solid var(--border)}
  #stats{display:none}
  #searchbox{width:auto;flex:1}
}
</style>
</head>

<header id="top">

</header>

<nav id="bar">

  <span id="chips" style="display:contents"></span>

  <span id="scns" style="display:contents"></span>
</nav>

<div id="main">

    <div id="relview" hidden></div>
    <div id="scnview" hidden></div>

  <aside id="panel">

// ───────── model ─────────
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IDS = Object.keys(ENTITIES);
const T = {};
const FKS = [];            // one per FK column
const PAIRS = new Map();   // "from|to" -> {from,to,cols[]}
IDS.forEach(id => { T[id] = Object.assign({ id, out: [], inn: [] }, ENTITIES[id]); });
function addFk(from, col, to, nullable, onDelete) {
  if (!T[to]) return;
  const fk = { from, col, to, nullable, onDelete };
  FKS.push(fk); T[from].out.push(fk); T[to].inn.push(fk);
  const k = from + '|' + to;
  if (!PAIRS.has(k)) PAIRS.set(k, { from, to, cols: [] });
  PAIRS.get(k).cols.push(col);
}
IDS.forEach(id => T[id].fields.forEach(f => {
  const c = f.constraint || '';
  const m = /→ ([\w.]+)(?: \(ON DELETE ([A-Z ]+)\))?/.exec(c);
  f.nullable = /^nullable/.test(c);
  f.unique = /UNIQUE/.test(c);
  f.isEnum = /, enum$/.test(c);
  const d = /default (.+?)(?:, enum)?(?: →.*)?$/.exec(c);
  f.def = d ? d[1] : (/gen_random_uuid\(\)/.test(c) ? 'gen_random_uuid()' : null);
  if (m) { f.to = m[1]; f.onDelete = m[2] || null; addFk(id, f.name, m[1], f.nullable, f.onDelete); }
}));
PK_FKS.forEach(([t, col, to]) => {
  const f = T[t].fields.find(x => x.name === col);
  if (f && !f.to) { f.to = to; addFk(t, col, to, false, null); }
});
const neighbours = id => new Set([...T[id].out.map(f => f.to), ...T[id].inn.map(f => f.from)]);
const ENUMS = new Map();
IDS.forEach(id => T[id].enums.forEach(e => { if (!ENUMS.has(e.name)) ENUMS.set(e.name, { name: e.name, vals: e.vals, tables: [] }); ENUMS.get(e.name).tables.push(id); }));

Object.entries(SCENARIOS).forEach(([key, sc]) => {

    const meta = (STEP_META[key] || [])[i] || [];
    st.title = meta[0] || 'Step ' + (i + 1);
    st.state = meta[1] || null;
    st.notes = [];
    let s = st.log.replace(/ -- (.*?)(?:; (?=<span class='kw'>)|$)/gs, (m, c) => { st.notes.push(c.replace(/<[^>]+>/g, '')); return m.endsWith('; ') ? ';\n\n' : ''; });
    s = s.replace(/; (?=<span class='kw'>)/g, ';\n\n')
         .replace(/ (<span class='kw'>(?:FROM|JOIN|WHERE|VALUES|SET|RETURNING|ORDER BY|ON CONFLICT DO NOTHING|SELECT)<\/span>)/g, '\n$1')
         .replace(/ AND /g, '\n  AND ');
    st.sql = s;
    st.writes = new Map([...st.log.matchAll(/(INSERT|UPDATE)(?: INTO)?<\/span> <span class='tbl'>([\w.]+)/g)].map(m => [m[2], m[1]]));
    const first = /<span class='kw'>(\w+)/.exec(st.log);
    st.op = first && first[1] === 'SELECT' ? 'READ' : first ? first[1] : 'READ';
  });
});

const S = { sel: null, hover: null, domains: new Set(), scn: null, step: 0, playing: false, zoom: 1, tab: 'overview', view: 'map' };

// ───────── layout ─────────
const CW = 184, CH = 64, GX = 12, GY = 12, PAD = 14, HEAD = 30, BGAP = 14, MARGIN = 16;
let W = 0, H = 0;
const canvas = $('#canvas'), wrap = $('#wrap'), sizer = $('#sizer');
const cardEl = {}, blockEl = {};

function buildCards() {
  DOMAINS.forEach(([d, label]) => {
    const n = IDS.filter(id => T[id].domain === d).length;
    const b = document.createElement('div');
    b.className = 'block d-' + d;
    b.innerHTML = `<h2>${esc(label)}<span>${n} ${n === 1 ? 'table' : 'tables'}</span></h2>`;
    canvas.appendChild(b); blockEl[d] = b;
  });
  IDS.forEach(id => {
    const t = T[id];
    const el = document.createElement('button');
    el.className = 'card d-' + t.domain;
    el.dataset.id = id;
    el.innerHTML = `<span class="nm">${esc(id).replace(/_/g, '_<wbr>')}</span>
      <span class="meta"><span title="columns"><b>${t.fields.length}</b> cols</span><span title="foreign keys this table holds"><b>${t.out.length}</b> out</span><span title="foreign keys pointing at this table"><b>${t.inn.length}</b> in</span></span>
      <span class="tag"></span>`;
    el.addEventListener('click', e => { e.stopPropagation(); select(id); });
    el.addEventListener('mouseenter', () => { if (!S.sel) neighbours(id).forEach(n => cardEl[n].classList.add('nb')); });
    el.addEventListener('mouseleave', () => { if (!S.sel) IDS.forEach(n => cardEl[n].classList.remove('nb')); });
    canvas.appendChild(el); cardEl[id] = el;
  });
}

function layout() {
  const SLACK = PAD * 2 + BGAP - GX;   // lets two blocks whose cards total one full row sit side by side
  const avail = (wrap.clientWidth || 1000) - MARGIN * 2 - SLACK;
  const cols = Math.max(3, Math.min(9, Math.floor((avail - PAD * 2 + GX) / (CW + GX))));
  const rowW = cols * CW + (cols - 1) * GX + PAD * 2;
  let x = MARGIN, y = MARGIN, rowH = 0;
  DOMAINS.forEach(([d]) => {
    const ids = IDS.filter(id => T[id].domain === d);
    const bw = Math.min(ids.length, cols);
    const rows = Math.ceil(ids.length / bw);
    const w = bw * CW + (bw - 1) * GX + PAD * 2;
    const h = HEAD + rows * CH + (rows - 1) * GY + PAD;
    if (x > MARGIN && x + w > MARGIN + rowW + SLACK) { x = MARGIN; y += rowH + BGAP; rowH = 0; }
    const b = blockEl[d];
    b.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    ids.forEach((id, i) => {
      const t = T[id];
      t.x = x + PAD + (i % bw) * (CW + GX);
      t.y = y + HEAD + Math.floor(i / bw) * (CH + GY);
      cardEl[id].style.left = t.x + 'px'; cardEl[id].style.top = t.y + 'px';
    });
    x += w + BGAP; rowH = Math.max(rowH, h);
  });
  W = MARGIN * 2 + rowW + SLACK; H = y + rowH + MARGIN;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  applyZoom();
  paint();
}
function applyZoom() {
  canvas.style.transform = `scale(${S.zoom})`;
  sizer.style.width = W * S.zoom + 'px'; sizer.style.height = H * S.zoom + 'px';
}
function setZoom(z) { S.zoom = Math.max(0.35, Math.min(1.6, z)); applyZoom(); }

// ───────── map highlighting (no lines on the map: relationships get their own view) ─────────
function fkDir(a, b) { return PAIRS.has(a + '|' + b) ? [a, b] : PAIRS.has(b + '|' + a) ? [b, a] : null; }
function paint() {
  const sel = S.sel, filt = S.domains.size > 0;
  canvas.classList.toggle('focus', !!sel);
  const par = sel ? new Set(T[sel].out.map(f => f.to)) : null, chi = sel ? new Set(T[sel].inn.map(f => f.from)) : null;
  IDS.forEach(id => {
    const el = cardEl[id], c = el.classList;
    const p = !!par && par.has(id) && id !== sel, ch = !!chi && chi.has(id) && id !== sel;
    c.toggle('sel', sel === id); c.toggle('nb', p || ch);
    c.toggle('off', filt && !S.domains.has(T[id].domain));
    el.querySelector('.tag').textContent = p && ch ? 'parent + child' : p ? 'parent' : ch ? 'child' : '';
  });
}

// ───────── ER diagrams ─────────
const pkOf = id => T[id].fields.find(f => f.pk) || T[id].fields[0];
// A row that carries data-to is a foreign-key column; its connector runs to the row carrying the matching data-pk.
function erRow(f, o = {}) {
  const a = [];
  if (o.pkKey) a.push(`data-pk="${esc(o.pkKey)}"`);
  if (o.to) a.push(`data-to="${esc(o.to)}" data-color="${o.color}"${f.nullable ? ' data-null="1"' : ''}${f.unique || f.pk ? ' data-uq="1"' : ''}`);
  return `<div class="er-r${f.pk ? ' pk' : ''}" ${a.join(' ')}><span class="rn">${esc(f.name)}</span>${o.badge || (o.type ? `<span class="rty">${esc(f.type)}</span>` : '')}</div>`;
}
function erCard(id, key, rows, o = {}) {
  return `<button class="ec d-${T[id].domain}${o.cls ? ' ' + o.cls : ''}" data-card="${esc(key)}" data-go="${esc(id)}">
    <div class="ec-h"><span class="ec-n">${esc(id)}</span>${o.badge || ''}</div>${rows.join('')}${o.foot || ''}</button>`;
}
function drawLinks(root) {
  const svg = root.querySelector(':scope > svg.links'), R = root.getBoundingClientRect();
  svg.setAttribute('width', root.scrollWidth); svg.setAttribute('height', root.scrollHeight);
  let h = '';
  root.querySelectorAll('[data-to]').forEach(row => {
    const tgt = root.querySelector(`[data-pk="${CSS.escape(row.dataset.to)}"]`); if (!tgt) return;
    const ca = row.closest('.ec'), cb = tgt.closest('.ec');
    const a = row.getBoundingClientRect(), b = tgt.getBoundingClientRect();
    const x1 = ca.getBoundingClientRect().left - R.left, y1 = a.top - R.top + a.height / 2;
    const x2 = cb.getBoundingClientRect().right - R.left, y2 = b.top - R.top + b.height / 2;
    const dx = Math.max(40, (x1 - x2) / 2), lookup = row.dataset.lookup;
    let d = `<path class="m" d="M${x1} ${y1}C${x1 - dx} ${y1} ${x2 + dx} ${y2} ${x2} ${y2}"/>`;
    if (!lookup) {
      d += row.dataset.uq ? `<path d="M${x1 - 7} ${y1 - 6}V${y1 + 6}"/>`                           // one
                          : `<path d="M${x1 - 12} ${y1}L${x1} ${y1 - 6}M${x1 - 12} ${y1}L${x1} ${y1 + 6}"/>`; // many (crow's foot)
      d += `<path d="M${x2 + 7} ${y2 - 6}V${y2 + 6}"/>`;                                            // one, at the referenced key
    }

function openPanel() { $('#panel').classList.remove('closed'); $('#reopen').classList.remove('show'); }
function hot(pair, on) {
  const r = $('#relview .er'); if (!r || S.scn || S.view !== 'rel') return;
  const [from, to] = pair.split('|');
  hilite(r, on ? (from === S.sel ? 'P:' + to : 'K:' + from) : null);
}
function select(id, field) {
  if (!T[id]) return;
  S.sel = id;
  if (S.domains.size && !S.domains.has(T[id].domain)) { S.domains.clear(); syncChips(); }
  if (!S.scn) S.view = 'rel';
  openPanel(); setTab('table'); show(); relinks(); setHash();
  if (field) {
    const row = pbody.querySelector(`.f[data-f="${CSS.escape(field)}"]`);
    if (row) { row.scrollIntoView({ block: 'center' }); row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 1800); }
  }
}
function clearSel() { S.sel = null; S.view = 'map'; show(); setTab(S.scn ? 'scenario' : 'overview'); setHash(); }
function startScenario(key, step = 0) {
  pause();
  S.scn = SCENARIOS[key]; S.step = step;
  document.querySelectorAll('.scn-btn').forEach(b => b.classList.toggle('on', b.dataset.scn === key));
  openPanel(); show(); renderLanes(); setTab('scenario'); goStep(step);
}
function stopScenario() {
  pause(); S.scn = null; S.step = 0;
  document.querySelectorAll('.scn-btn').forEach(b => b.classList.remove('on'));
  show(); setTab(S.sel ? 'table' : 'overview'); setHash();
}
function goStep(i) {
  const sc = S.scn; if (!sc) return;
  S.step = Math.max(0, Math.min(sc.steps.length - 1, i));
  let cur = null;
  document.querySelectorAll('.lane').forEach((l, k) => { l.classList.toggle('cur', k === S.step); if (k === S.step) cur = l; });
  if (cur) {
    const top = cur.offsetTop - $('#viewbar').offsetHeight - 10;
    if (top < wrap.scrollTop || cur.offsetTop + cur.offsetHeight > wrap.scrollTop + wrap.clientHeight) wrap.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
  syncScenario(); setHash();
}
function pause() { clearTimeout(timer); timer = null; S.playing = false; if (S.scn) syncScenario(false); }
function tick() {
  timer = setTimeout(() => {
    if (!S.playing || !S.scn) return;
    if (S.step >= S.scn.steps.length - 1) { pause(); return; }
    goStep(S.step + 1);
    if (S.step >= S.scn.steps.length - 1) pause(); else tick();
  }, PLAY_MS);
}
function togglePlay() {
  if (S.playing) { pause(); return; }
  if (S.step >= S.scn.steps.length - 1) goStep(0);
  S.playing = true; syncScenario(false); tick();
}

// ───────── chrome ─────────
function syncChips() { document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', S.domains.has(c.dataset.d))); }
function buildBar() {
  $('#chips').innerHTML = DOMAINS.map(([d, label]) => {
    const n = IDS.filter(id => T[id].domain === d).length;
    return `<button class="chip d-${d}" data-d="${d}" title="${esc(label)}"><i></i>${esc(label.replace(/ \(.*/, ''))}<span class="num">${n}</span></button>`;
  }).join('');
  $('#scns').innerHTML = Object.values(SCENARIOS).map(sc => `<button class="scn-btn" data-scn="${sc.key}" style="--c:${sc.color}">${esc(sc.label)}</button>`).join('');
  $('#stats').innerHTML = `schema v4.17, <span class="num">${IDS.length}</span> tables (<span class="num">${IDS.filter(i => !i.startsWith('cms.')).length}</span> public + <span class="num">${IDS.filter(i => i.startsWith('cms.')).length}</span> cms), <span class="num">${DOMAINS.length}</span> domains, PostgreSQL 16`;
}
$('#bar').addEventListener('click', e => {
  const chip = e.target.closest('.chip'), sb = e.target.closest('.scn-btn');
  if (chip) {
    const d = chip.dataset.d;
    S.domains.has(d) ? S.domains.delete(d) : S.domains.add(d);
    if (!S.scn && S.view !== 'map') { S.view = 'map'; show(); }
    syncChips(); paint();
    if (S.domains.has(d)) reveal(IDS.filter(id => T[id].domain === d));
  } else if (sb) {
    if (S.scn && S.scn.key === sb.dataset.scn) stopScenario(); else startScenario(sb.dataset.scn);
  }
});
$('#tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t && !t.disabled) setTab(t.dataset.tab); });
$('#pclose').onclick = () => { $('#panel').classList.add('closed'); $('#reopen').classList.add('show'); layout(); relinks(); };
$('#reopen').onclick = () => { openPanel(); layout(); relinks(); };
pbody.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'), scn = e.target.closest('[data-scn]'), step = e.target.closest('[data-step]');
  if (go) select(go.dataset.go);
  else if (scn) startScenario(scn.dataset.scn, +scn.dataset.step);
  else if (step && S.scn) { pause(); goStep(+step.dataset.step); }
});
pbody.addEventListener('mouseover', e => { const p = e.target.closest('[data-pair]'); if (p) hot(p.dataset.pair, true); });
pbody.addEventListener('mouseout', e => { const p = e.target.closest('[data-pair]'); if (p) hot(p.dataset.pair, false); });
wrap.addEventListener('click', e => {
  const seg = e.target.closest('.segc button'), go = e.target.closest('.ec[data-go]'), lane = e.target.closest('.lane');
  if (e.target.closest('#scn-exit')) stopScenario();
  else if (seg) {
    if (S.scn) { pause(); S.scn = null; document.querySelectorAll('.scn-btn').forEach(b => b.classList.remove('on')); }
    if (seg.dataset.view === 'rel' && !S.sel) { select('enrollments'); return; }
    S.view = seg.dataset.view; show(); setTab(S.sel ? 'table' : 'overview'); setHash();
  }
  else if (go) select(go.dataset.go);
  else if (lane && S.scn) { pause(); goStep(+lane.dataset.step); }
  else if (e.target.closest('#mapview') && !e.target.closest('.card') && S.sel) clearSel();
});
wrap.addEventListener('mouseover', e => { const c = e.target.closest('.ec'); if (c) hilite(c.closest('.er'), c.dataset.card); });
wrap.addEventListener('mouseout', e => { const c = e.target.closest('.ec'); if (c && !c.contains(e.relatedTarget)) hilite(c.closest('.er'), null); });

wrap.addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault(); setZoom(S.zoom * (e.deltaY < 0 ? 1.1 : 0.9));
}, { passive: false });
$('#zoom-in').onclick = () => setZoom(S.zoom + 0.15);
$('#zoom-out').onclick = () => setZoom(S.zoom - 0.15);
$('#zoom-fit').onclick = () => {
  const fit = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
  setZoom(Math.abs(S.zoom - 1) < 0.01 ? fit : 1); wrap.scrollTo(0, 0);
};
$('#theme').onclick = e => {
  const light = document.body.classList.toggle('light');
  e.currentTarget.textContent = light ? 'Dark' : 'Light';
  try { localStorage.setItem('abethu-explorer-theme', light ? 'light' : 'dark'); } catch (err) {}
};

// ───────── search ─────────
const INDEX = [];
IDS.forEach(id => {
  INDEX.push({ kind: 'table', text: id, table: id });
  T[id].fields.forEach(f => INDEX.push({ kind: 'column', text: f.name, table: id, field: f.name, sub: f.type }));
});
ENUMS.forEach(en => {
  INDEX.push({ kind: 'enum', text: en.name, table: en.tables[0], sub: en.tables.length + (en.tables.length === 1 ? ' table' : ' tables') });
  en.vals.forEach(v => INDEX.push({ kind: 'value', text: v, table: en.tables[0], sub: en.name }));
});
const search = $('#search'), results = $('#results');
let hits = [], cur = 0;
function runSearch() {
  const q = search.value.trim().toLowerCase();
  if (!q) { results.classList.remove('open'); hits = []; return; }
  const rank = { table: 0, column: 1, enum: 2, value: 3 };
  hits = INDEX.filter(x => x.text.toLowerCase().includes(q))
    .sort((a, b) => (a.text.toLowerCase().startsWith(q) ? 0 : 1) - (b.text.toLowerCase().startsWith(q) ? 0 : 1) || rank[a.kind] - rank[b.kind] || a.text.length - b.text.length)
    .slice(0, 40);
  cur = 0;
  const hl = s => { const i = s.toLowerCase().indexOf(q); return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
  results.innerHTML = hits.length ? hits.map((h, i) => `<button class="res d-${T[h.table].domain}${i === 0 ? ' cur' : ''}" data-i="${i}"><span class="k">${h.kind}</span><span>${h.kind === 'table' ? `<span class="t">${hl(h.text)}</span>` : hl(h.text)}</span><span class="s">${h.kind === 'table' ? esc(DLABEL[T[h.table].domain].replace(/ \(.*/, '')) : `<span class="t">${esc(h.table)}</span>${h.kind === 'value' ? ' ' + esc(h.sub) : ''}`}</span></button>`).join('')
    : '<div class="res-empty">Nothing matches.</div>';
  results.classList.add('open');
}
function pick(i) {
  const h = hits[i]; if (!h) return;
  results.classList.remove('open'); search.blur();
  select(h.table, h.field);
}
search.addEventListener('input', runSearch);
search.addEventListener('focus', runSearch);
search.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!hits.length) return;
    cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    results.querySelectorAll('.res').forEach((r, i) => { r.classList.toggle('cur', i === cur); if (i === cur) r.scrollIntoView({ block: 'nearest' }); });
  } else if (e.key === 'Enter') pick(cur);
  else if (e.key === 'Escape') { search.value = ''; results.classList.remove('open'); search.blur(); e.stopPropagation(); }
});
results.addEventListener('mousedown', e => { const r = e.target.closest('.res'); if (r) { e.preventDefault(); pick(+r.dataset.i); } });
document.addEventListener('click', e => { if (!e.target.closest('#searchbox')) results.classList.remove('open'); });
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); search.focus(); search.select(); }
  else if (typing) return;
  else if (e.key === 'Escape') { if (S.scn) stopScenario(); else if (S.sel) clearSel(); }
  else if (S.scn && e.key === 'ArrowRight') { pause(); goStep(S.step + 1); }
  else if (S.scn && e.key === 'ArrowLeft') { pause(); goStep(S.step - 1); }
});

// ───────── init ─────────
try { if (localStorage.getItem('abethu-explorer-theme') === 'light') { document.body.classList.add('light'); $('#theme').textContent = 'Dark'; } } catch (e) {}
buildBar(); buildCards(); layout(); show(); setTab('overview');
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { layout(); relinks(); }, 120); });
(function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('t=') && T[h.slice(2)]) select(h.slice(2));
  else if (h.startsWith('s=')) { const [k, n] = h.slice(2).split(':'); if (SCENARIOS[k]) startScenario(k, Math.max(0, (parseInt(n, 10) || 1) - 1)); }
})();
</script>
</body>
